name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libproj-dev proj-data proj-bin libgeos-dev

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Install GDAL and other geospatial dependencies via conda
        conda install -c conda-forge gdal geos proj pyproj fiona shapely geopandas -y
      shell: bash

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine pytest pytest-cov
        
    - name: Install package dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: pip install -e .
        
    - name: Install package dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Install geospatial packages from conda-forge first
        pip install --no-deps geopandas fiona shapely pyproj
        pip install -e . --no-deps
        # Install remaining dependencies
        pip install numpy scipy pandas dask openpyxl frozenlist jsonpickle distributed geoalchemy2 ray dill sqlalchemy flask gunicorn psycopg2-binary pyarrow psycopg-binary blosc polars websockets redis scikit-learn duckdb ipywidgets

    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Test with pytest
      run: |
        pytest --cov=m4i --cov-report=xml --cov-report=term-missing
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libproj-dev proj-data proj-bin libgeos-dev

    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        conda install -c conda-forge gdal geos proj pyproj fiona shapely geopandas -y
      shell: bash

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-${{ matrix.os }}-${{ github.sha }}
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/m4i
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - name: Download build artifacts (Ubuntu)
      uses: actions/download-artifact@v3
      with:
        name: dist-ubuntu-latest-${{ github.sha }}
        path: dist/

    - name: Download build artifacts (Windows)
      uses: actions/download-artifact@v3
      with:
        name: dist-windows-latest-${{ github.sha }}
        path: dist-windows/

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # Use trusted publishing or fallback to API token
      with:
        password: ${{ secrets.PYPI_API_TOKEN || '' }}