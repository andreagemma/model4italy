[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "m4i"
dynamic = ["version", "dependencies"]
authors = [
    { name = "Andrea Gemma", email = "andrea.geoma@uniroma3.it" }
]
description = "Mesoscopic assignment and simulation model for the analysis of transportation systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "transportation",
    "simulation",
    "assignment",
    "mesoscopic",
    "transport",
    "traffic"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Front-Ends",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
[project.optional-dependencies]
db = [
  "sqlalchemy>=2.0"
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1"
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
version = {attr = "m4i.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}
license-files = [
    "LICENSE",
    "AUTHORS",
    "COPYING",
    "THIRD_PARTY_NOTICES.md",
    "licenses/third_party/packages/**/LICENSE*",
    "licenses/third_party/packages/**/LICENCE*",
    "licenses/third_party/packages/**/COPYING*",
    "licenses/third_party/packages/**/NOTICE*",
    "licenses/third_party/packages/**/AUTHORS*"
]

[project.urls]
Documentation = "https://github.com/andreagemma/model4italy#readme"
Issues = "https://github.com/andreagemma/model4italy/issues"
Source = "https://github.com/andreagemma/model4italy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m4i = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["m4i"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".venv",
  "build",
  "dist",
  "src/m4i.egg-info",
  "venv",
  "wheel-smoke-test"
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["src/m4i"]
warn_unused_configs = true
check_untyped_defs = true
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
]
ignore_errors = true
