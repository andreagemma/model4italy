[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "m4i"
dynamic = ["version"]
authors = [
    { name = "Andrea Gemma", email = "andrea.geoma@uniroma3.it" }
]
description = "Mesoscopic assignment and simulation model for the analysis of transportation systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "joblib==1.5.3",
  "shapely==2.1.2",
  # --- Configurazione Condizionale per FIONA ---
  # 1. Se l'utente è su Windows ed usa Python fino a 3.13, scarica Fiona normalmente da PyPI
  "fiona==1.10.1; sys_platform == 'win32' and python_version < '3.14'",
  
  # 2. Se l'utente è su Windows ed usa Python 3.14, scarica la Wheel precompilata direttamente dalle release di Gohlke
  "fiona @ https://github.com/cgohlke/geospatial-wheels/releases/download/v2026.8.20/fiona-1.10.1-cp314-cp314-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.14'",
  
  # 3. Se l'utente NON è su Windows (es. Linux o macOS), installa Fiona da PyPI senza problemi di compilazione C
  "fiona==1.10.1; sys_platform != 'win32'",
  "pyproj==3.7.0; python_version <= '3.10'",
  "pyproj==3.7.2; python_version > '3.10'",
  "psutil==7.2.2",
  "pytz==2026.1.post1",
  "numpy==2.2.3; python_version <= '3.10'",
  "numpy==2.4.4; python_version > '3.10'",
  "pandas<=2.2.3; python_version <= '3.10'",
  "pandas==3.0.2; python_version > '3.10'",
  "scipy<=1.15.2; python_version <= '3.10'",
  "scipy==1.17.1; python_version > '3.10'",
  "geopandas==1.1.3",
  "polars==1.40.0",
  "scikit-learn<=1.7.2; python_version <= '3.10'",
  "scikit-learn==1.8.0; python_version > '3.10'",
  "psycopg==3.3.3",
  "psycopg-binary==3.3.3",
  "sqlalchemy==2.0.49",
  "geoalchemy2==0.19.0",
  "duckdb==1.5.2",
  "dill==0.4.0",
  "python-snappy>=0.7.3",
  "pyarrow==23.0.1",
  "blosc==1.11.4",
  "flask==3.1.3",
  "gunicorn==23.0.0",
  "websockets==16.0"
]
keywords = [
    "transportation",
    "simulation",
    "assignment",
    "mesoscopic",
    "transport",
    "traffic"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Front-Ends",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
[project.optional-dependencies]
db = [
  "sqlalchemy>=2.0"
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1"
]

[tool.setuptools.dynamic]
version = {attr = "m4i._version.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}
license-files = [
    "LICENSE",
    "AUTHORS",
    "COPYING",
    "THIRD_PARTY_NOTICES.md",
    "licenses/third_party/packages/**/LICENSE*",
    "licenses/third_party/packages/**/LICENCE*",
    "licenses/third_party/packages/**/COPYING*",
    "licenses/third_party/packages/**/NOTICE*",
    "licenses/third_party/packages/**/AUTHORS*"
]

[project.urls]
Documentation = "https://github.com/andreagemma/model4italy#readme"
Issues = "https://github.com/andreagemma/model4italy/issues"
Source = "https://github.com/andreagemma/model4italy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m4i = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["m4i"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".venv",
  "build",
  "dist",
  "src/m4i.egg-info",
  "venv",
  "wheel-smoke-test"
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["src/m4i"]
warn_unused_configs = true
check_untyped_defs = true
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
]
ignore_errors = true
